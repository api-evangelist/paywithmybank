name: PayWithMyBank (Trustly)
description: >-
  PayWithMyBank is the U.S. "Pay by Bank" brand of Trustly, a global open-banking
  payments provider that lets merchants accept payments directly from a consumer's
  bank account as an alternative to cards. The paywithmybank.com domain now
  redirects to Trustly, whose AMER developer platform exposes a REST Payments API
  (OpenAPI 3.1) covering transactions (establish, capture, deposit, cancel,
  reclaim, refund), payments retrieval, bank-account tokenization and verification,
  customer records, identity (Trustly ID), account data, dispute recovery, and
  asynchronous event notifications (webhooks). Authentication is HTTP Basic with a
  provisioned accessId/accessKey plus a server-generated requestSignature for the
  client-side Lightbox. Trustly operates the largest open-banking payments network
  with 12,000+ connected banks across 30+ countries.
