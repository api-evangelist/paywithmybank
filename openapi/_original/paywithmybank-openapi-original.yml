      summary: Reclaim transaction
      description: >-
        Reclaims a previously completed Deposit transaction (minimum of 0.99). You can optionally reclaim partially. You
        can do so as many times as you wish until the entire deposited amount has been reclaimed.


        A Deposit transaction can only be reclaimed after the transaction has been processed and completed.


        Ensure you also implement an [event notification](/integrate/core-concepts/webhooks-and-events) handler to get
        transaction status updates.
      tags:
        - transactions
      parameters:
        - name: transactionId
          in: path
          description: Deposit Transaction ID retrieved from a Trustly Deposit transaction.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  type: string
                  description: >-
                    A specific merchant reference for this reclaim. For example, this could be a merchant order number
                    or the same merchant reference value used in the original establish call.
                amount:
                  type: string
                  description: >-
                    The amount to be reclaimed which can be less or equal than the current balance of the deposit
                    transaction being reclaimed. If the value is omitted the remaining balance is reclaimed. (maximum of
                    10 characters with support for 2 decimal places)
              required:
                - amount
  /transactions/{transactionId}/refresh:
    post:
      operationId: post-transactions-refresh
      summary: Refresh a transaction
      description: Refresh allows for data associated with a transaction to be updated to the most recent available.
      tags:
        - transactions
      parameters:
        - name: transactionId
          in: path
          description: >-
            Authorization Transaction ID retrieved from a Trustly Deferred or Recurring transaction, or Preauthorization
            Transaction ID retrieved from a Trustly Preauthorize API.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions_post-transactions-refresh_Response_200'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                splitToken:
                  type: string
                  description: 'Token received from the Authorize event. Note: string value must be URL encoded.'
              required:
                - splitToken
  /transactions/{transactionId}/refund:
    post:
      operationId: post-transactions-refund
      summary: Refund transaction
      description: >-
        Refunds a previously completed Capture or Instant transaction (minimum of 0.99). You can optionally refund
        partially. You can do so as many times as you wish until the entire collected amount has been refunded.


        A *Capture* or *Pay* transaction can only be refunded after the bank money collection has been processed and
        completed.


        Ensure you also implement an Event Notification Handler to get transaction status updates.
      tags:
        - transactions
      parameters:
        - name: transactionId
          in: path
          description: Capture Transaction ID retrieved from a Trustly Capture transaction.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  type: string
                  description: >-
                    A specific merchant reference for this refund. For example, this could be a merchant order number or
                    the same merchant reference value used in the original establish call.
                amount:
                  type: string
                  description: >-
                    The amount to be refunded which can be less or equal than the current balance of the transaction
                    being refunded. If the value is omitted the remaining balance is refunded. (maximum of 10 characters
                    with support for 2 decimal places)
  /transactions/{transactionId}:
    get:
      operationId: get-transaction
      summary: Retrieve a transaction
      description: >-
        This endpoint allows you to retrieve comprehensive details about a transaction using its unique identifier
        `transactionId`. The response includes key transaction information, such as the transaction status, as well as
        amounts, and account details for payment or authorization transactions. This endpoint is useful for checking the
        current state of a transaction or verifying transaction information after processing.
      tags:
        - transactions
      parameters:
        - name: transactionId
          in: path
          description: Transaction ID retrieved from Trustly.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
  /transactions/{transactionId}/payment/customer/verify:
    get:
      operationId: get-verify-customer
      summary: Get customer verification data
      description: Retrieves verification results for a given transaction. Returns a match result for each attribute compared.
      tags:
        - verifyCustomer
      parameters:
        - name: transactionId
          in: path
          description: The unique identifier of the transaction.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify Customer_get-verify-customer_Response_200'
        '400':
          description: One or more required fields are missing from the request object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-verify-customerRequestBadRequestError'
        '401':
          description: Access not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-verify-customerRequestUnauthorizedError'
servers:
  - url: https://sandbox.trustly.one/api/v1
    description: Sandbox
webhooks:
  subpackage_eventNotifications.Authorize:
    post:
      operationId: subpackage_eventNotifications.Authorize
      summary: Authorize
      description: The `Authorize` event indicates that the user has successfully authorized the transaction with their bank.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAuthorize'
  subpackage_eventNotifications.Completed:
    post:
      operationId: subpackage_eventNotifications.Completed
      summary: Completed
      description: The `Completed` event indicates that the funds for a transaction have successfully settled.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCompleted'
  subpackage_eventNotifications.DataReady:
    post:
      operationId: subpackage_eventNotifications.DataReady
      summary: Data Ready
      description: >-
        The `DataReady` event indicates that all bank-qualified data, such as account details and balance, has been
        retrieved and is ready for consumption. Wait for this event before calling Account Data endpoints.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDataReady'
  subpackage_eventNotifications.Dispute:
    post:
      operationId: subpackage_eventNotifications.Dispute
      summary: Dispute
      description: >-
        The `Dispute` indicates that a transaction received a return that generated a dispute. The returnType property
        specifies the type of return
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                createdAt:
                  type: string
                  format: int64
                  description: The timestamp when the event was created, represented as a Unix timestamp in milliseconds.
                eventId:
                  type: string
                  description: Unique identifier for the event.
                eventType:
                  type: string
                  description: The type of event that triggered the webhook.
                objectId:
                  type: string
                  description: Unique identifier for the object associated with the event, such as a transaction.
                objectType:
                  type: string
                  description: The type of object associated with the event (e.g., Stopped).
                reference:
                  type: string
                transactionId:
                  type: string
                transactionDatetime:
                  type: string
                returnType:
                  type: string
                customerId:
                  type: string
                returnDatetime:
                  type: string
                amountReturned:
                  type: string
  subpackage_eventNotifications.Establish:
    post:
      operationId: subpackage_eventNotifications.Establish
      summary: Establish
      description: >-
        TThe `Establish` event indicates that a new transaction has been created. This occurs when a user activates the
        Trustly User Interface (UI) or when you create a transaction using the API
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEstablish'
  subpackage_eventNotifications.Expired:
    post:
      operationId: subpackage_eventNotifications.Expired
      summary: Expired
      description: The `Expired` event indicates that a transaction or session timed out before the user completed the flow.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventExpire'
  subpackage_eventNotifications.Failed:
    post:
      operationId: subpackage_eventNotifications.Failed
      summary: Failed
      description: >-
        The `Failed` event indicates that the transaction could not be completed because of an error, decline, or
        cancellation.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFailed'
  subpackage_eventNotifications.Refresh:
    post:
      operationId: subpackage_eventNotifications.Refresh
      summary: Refresh
      description: The `Refresh` event indicates that the account data for a transaction has been successfully refreshed.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRefresh'
  subpackage_eventNotifications.Update:
    post:
      operationId: subpackage_eventNotifications.Update
      summary: Update
      description: >-
        The `Update` event indicates that the status of a transaction has changed. For example, when a transaction moves
        from `Pending` to `Authorized`
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
  subpackage_eventNotifications.VerifyCustomer:
    post:
      operationId: subpackage_eventNotifications.VerifyCustomer
      summary: Verify Customer
      description: >-
        The `VerifyCustomer` event provides the result of the identity verification check performed against the data
        from the bank.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventVerifyCustomer'
