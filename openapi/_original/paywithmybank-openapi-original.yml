      summary: Preauthorize transaction
      description: >-
        The Preauthorize API allows the merchant to pre-authorize one or more captures up to the total pre-authorized
        amount on a pre-authorized period interval in hours. Captures after the pre-authorized period interval are
        treated as normal Captures (will need to pass the full balance and risk analysis to be guaranteed).
      tags:
        - transactions
      parameters:
        - name: transactionId
          in: path
          description: Authorization Transaction ID retrieved from a Trustly Deferred or Recurring transaction.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  type: string
                  description: >-
                    A specific merchant reference for this preauthorization. For example, this could be a merchant order
                    number or the same merchant reference value used in the original establish call.
                period:
                  type: integer
                  default: 0
                  description: Number of hours the preauthorization will be valid for.
                amount:
                  type: string
                  description: >-
                    The amount to be authorized. (maximum of 10 characters with support for 2 decimal places). Required
                    if the bank authorization was created with an amount of 0.00. If not specified, then the full amount
                    of the bank authorization will be used.
                splitToken:
                  type: string
                  description: Token received on the Authorize event.
                externalTier:
                  type: string
